global:
  scrape_interval: 5s

scrape_configs:
  - job_name: springboot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.containers.internal:8080
  - job_name: mysql
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.containers.internal:9104